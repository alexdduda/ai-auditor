[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-auditor"
version = "0.2.0"
description = "A framework for auditing AI-generated answers: pluggable stages run as a dependency graph."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["anthropic>=0.70.0", "pydantic>=2.0"]

[project.scripts]
ai-auditor = "ai_auditor.cli:main"

[tool.setuptools]
packages = ["ai_auditor"]
